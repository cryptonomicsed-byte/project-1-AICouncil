name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          flake8 services middleware --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 services middleware --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Type check with mypy
        run: mypy services middleware --ignore-missing-imports
        continue-on-error: true

      - name: Test with pytest
        run: pytest services middleware -v --cov=services --cov=middleware --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false

  test-js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint with ESLint
        run: npm run lint:js
        continue-on-error: true

      - name: Format check with Prettier
        run: npx prettier --check 'apps/**/*.{ts,tsx,js,jsx}' 'services/**/*.{ts,tsx,js,jsx}' 'middleware/**/*.{ts,tsx,js,jsx}'
        continue-on-error: true

      - name: Type check with TypeScript
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Test with Jest
        run: npm run test:js -- --coverage
        continue-on-error: true

  blockchain-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[blockchain]"

      - name: Test blockchain integration
        run: |
          cd services/neural-brain
          python -m pytest test_blockchain_integration.py -v
        env:
          BLOCKCHAIN_CHAIN: sui
          CONSENSUS_THRESHOLD: '0.5'
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker images
        run: docker compose build
        env:
          DOCKER_BUILDKIT: 1

      - name: Test Docker containers
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          docker compose logs
        continue-on-error: true

      - name: Cleanup
        run: docker compose down
        if: always()
