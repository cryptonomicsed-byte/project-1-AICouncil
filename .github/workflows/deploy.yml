name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Akash (Staging)
        run: |
          echo "Deploying to Akash staging environment..."
          # Add Akash deployment here
          # Example:
          # akash deploy --from staging --manifest deploy/akash/manifest-staging.yml
        env:
          AKASH_ACCOUNT_ADDRESS: ${{ secrets.AKASH_ACCOUNT_ADDRESS }}
          AKASH_PRIVATE_KEY: ${{ secrets.AKASH_PRIVATE_KEY }}
        continue-on-error: true

      - name: Notify deployment
        if: always()
        run: |
          echo "Staging deployment completed"

  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Akash (Production)
        run: |
          echo "Deploying to Akash production environment..."
          # Add Akash deployment here
          # Example:
          # akash deploy --from production --manifest deploy/akash/manifest.yml
        env:
          AKASH_ACCOUNT_ADDRESS: ${{ secrets.AKASH_ACCOUNT_ADDRESS_PROD }}
          AKASH_PRIVATE_KEY: ${{ secrets.AKASH_PRIVATE_KEY_PROD }}
        continue-on-error: true

      - name: Notify deployment
        if: always()
        run: |
          echo "Production deployment completed"

  verify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Verify services health
        run: |
          echo "Verifying deployed services..."
          # Add health check logic here
          # Example:
          # curl -f http://staging.aicouncil.dev/health || exit 1

      - name: Create deployment summary
        if: always()
        run: |
          cat << EOF
          ## Deployment Summary
          
          - **Trigger**: ${{ github.event_name }}
          - **Ref**: ${{ github.ref }}
          - **Commit**: ${{ github.sha }}
          - **Status**: ${{ job.status }}
          EOF
